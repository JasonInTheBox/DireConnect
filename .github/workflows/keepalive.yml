# Keep-alive ping for the free-tier services.
#
# Why this exists: Supabase pauses free projects, and free Redis databases are
# archived, after a period without activity. Once a day this workflow calls
# GET /api/keepalive on the deployed API, which runs a real database query
# (SELECT 1), a real Redis write (a key with an expiry) and a real request to
# Supabase Auth. As a side effect it also wakes the API on Render's free tier.
#
# Settings to add in the repository (Settings > Secrets and variables > Actions):
#   - Secret   KEEPALIVE_TOKEN    the same value as KEEPALIVE_TOKEN on the API
#   - Variable KEEPALIVE_API_URL  the API origin, for example https://api.example.com
#                                 (no trailing slash, no path)
#
# Things to know:
#   - Scheduled workflows run only from the default branch.
#   - GitHub disables scheduled workflows after 60 days without repository
#     activity. If that happens, re-enable the workflow in the Actions tab.
#   - A failed run emails the repository owner. Open the run log: the JSON
#     response lists which check (database, redis, supabase) failed.
#   - The Render free API can take about a minute to cold start, so the request
#     waits up to 2 minutes and is retried several times before the run fails.
#   - The token is only passed through the environment. Never add `set -x` or
#     print it.

name: Keep services awake

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping the API
    runs-on: ubuntu-latest
    # Worst case: 6 attempts x 120 s + 5 x 30 s pauses = 14.5 minutes.
    timeout-minutes: 20
    env:
      KEEPALIVE_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
      KEEPALIVE_API_URL: ${{ vars.KEEPALIVE_API_URL }}

    steps:
      - name: Check configuration
        run: |
          if [ -z "${KEEPALIVE_TOKEN}" ]; then
            echo "::error::The KEEPALIVE_TOKEN repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${KEEPALIVE_API_URL}" ]; then
            echo "::error::The KEEPALIVE_API_URL repository variable is not set. Add the API origin, for example https://api.example.com."
            exit 1
          fi
          case "${KEEPALIVE_API_URL}" in
            http://* | https://*) ;;
            *)
              echo "::error::KEEPALIVE_API_URL must start with https:// (or http://)."
              exit 1
              ;;
          esac

      - name: Ping
        run: |
          curl --silent --show-error --fail-with-body \
            --retry 5 --retry-delay 30 --retry-all-errors --max-time 120 \
            --header "Authorization: Bearer ${KEEPALIVE_TOKEN}" \
            "${KEEPALIVE_API_URL%/}/api/keepalive"
          echo
