name: DireConnect CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build monorepo
    runs-on: ubuntu-latest
    env:
      # CI-only placeholders. Never use deployment credentials here; delivery stays in fake mode.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: fake-publishable-key
      REDIS_URL: redis://localhost:6379
      CLIENT_URL: http://localhost:3000
      APP_URL: http://localhost:4000
      MESSAGE_MODE: fake
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fake-publishable-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build shared packages
        run: npm run build:packages

      - name: Test and build applications in parallel
        run: |
          npm test &
          test_pid=$!
          npm run build -w apps/api &
          api_pid=$!
          npm run build -w apps/worker &
          worker_pid=$!
          npm run build -w apps/web &
          web_pid=$!

          failed=""
          wait "$test_pid" || failed="$failed tests"
          wait "$api_pid" || failed="$failed api"
          wait "$worker_pid" || failed="$failed worker"
          wait "$web_pid" || failed="$failed frontend"

          if [ -n "$failed" ]; then
            printf 'Failed checks:%s\n' "$failed"
            exit 1
          fi
