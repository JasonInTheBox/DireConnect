services:
  redis:
    image: redis:7-alpine
    container_name: direconnect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: direconnect-api
    container_name: direconnect-api
    ports:
      - "4000:4000"
    env_file:
      - ./apps/api/.env
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 4000
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: direconnect-worker
    container_name: direconnect-worker
    env_file:
      - ./apps/worker/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

volumes:
  redis-data:
